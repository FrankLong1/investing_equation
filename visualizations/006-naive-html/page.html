<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research Loop · Naive HTML · Investing Equation</title>
<style>
:root{color-scheme:light dark;--background:light-dark(#fff,#181818);--foreground:light-dark(#1a1c1f,#fff);--card:color-mix(in oklab,var(--foreground) 5%,var(--background));--card-foreground:var(--foreground);--border:color-mix(in srgb,var(--foreground) 18%,var(--background));--muted-foreground:light-dark(#59616b,#bac0c8);--viz-series-1:light-dark(#339cff,#83c3ff);--viz-series-2:light-dark(#f3883b,#f59a56);font:14px/1.5 system-ui,sans-serif;background:var(--background);color:var(--foreground)}
body{margin:0;padding:24px}main{max-width:736px;margin:auto}h2{font-size:20px;line-height:1.3}h3{font-size:16px;line-height:1.4}.text-small{font-size:12px}a{color:inherit}#research-portfolio-loop a.node{text-decoration:none;transition:background .12s}#research-portfolio-loop a.node:hover{background:color-mix(in srgb,var(--viz-series-1) 12%,var(--card))}a:focus-visible,button:focus-visible{outline:2px solid var(--viz-series-1);outline-offset:3px}.page-nav{display:flex;justify-content:space-between;gap:16px;margin-bottom:20px;color:var(--muted-foreground);font-size:12px}.page-nav a{text-underline-offset:3px}
dialog{box-sizing:border-box;width:min(880px,calc(100% - 24px));max-height:88vh;padding:0;border:1px solid var(--border);border-radius:14px;background:var(--background);color:var(--foreground)}dialog::backdrop{background:#0008}.reader-bar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;background:var(--background);border-bottom:1px solid var(--border);z-index:1}.reader-bar button{font:inherit;color:inherit;border:1px solid var(--border);background:var(--card);border-radius:7px;padding:6px 12px;cursor:pointer}.reader-content{padding:20px 28px;overflow-wrap:anywhere}.reader-content h1{font-size:25px;line-height:1.3}.reader-content h2{margin-top:28px}.reader-content h3{margin-top:24px}.reader-content a{color:var(--viz-series-1);text-underline-offset:3px}.reader-content table{display:block;overflow:auto;border-collapse:collapse;width:100%;font-size:13px}.reader-content th,.reader-content td{text-align:left;padding:10px;min-width:140px;border-bottom:1px solid var(--border);vertical-align:top}.reader-content pre{overflow:auto;padding:12px;background:var(--card);border-radius:6px;font-size:12px}.reader-content code{font-family:ui-monospace,monospace}.source-link{font-size:12px}.reader-content img{max-width:100%}[hidden]{display:none!important}@media(max-width:540px){body{padding:12px}.reader-content{padding:14px 16px}}@media(prefers-reduced-motion:reduce){#research-portfolio-loop a.node{transition:none}}
</style>
</head>
<body>
<main>
<nav class="page-nav"><a href="../index.html">← Visualization lab</a><span>006 · Naive HTML</span></nav>
<!-- DIAGRAM -->
</main>
<dialog id="document-reader" aria-labelledby="reader-title">
<div class="reader-bar"><span id="reader-title">Framework document</span><button type="button" id="close-reader">Close</button></div>
<div class="reader-content">
<!-- DOCUMENTS -->
</div>
</dialog>
<script>
(() => {
  const reader = document.getElementById('document-reader');
  const title = document.getElementById('reader-title');
  const articles = [...reader.querySelectorAll('article')];
  let opener = null;
  function showDocument() {
    const article = articles.find(item => '#' + item.id === location.hash);
    if (!article) { if (reader.open) reader.close(); return; }
    articles.forEach(item => { item.hidden = item !== article; });
    title.textContent = article.querySelector('h1')?.textContent || 'Framework document';
    if (!reader.open) { opener = document.activeElement; reader.showModal(); }
    reader.scrollTop = 0;
  }
  reader.addEventListener('close', () => {
    if (articles.some(item => '#' + item.id === location.hash)) history.replaceState(null, '', location.pathname + location.search);
    opener?.focus();
  });
  document.getElementById('close-reader').addEventListener('click', () => reader.close());
  window.addEventListener('hashchange', showDocument);
  showDocument();
})();
</script>
</body>
</html>
