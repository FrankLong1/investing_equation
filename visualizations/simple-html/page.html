<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research Loop · Simple HTML · Investing Equation</title>
<style>
:root{color-scheme:light;--background:#f8f9fa;--foreground:#1d2533;--card:#fff;--card-foreground:#1d2533;--border:#1d253329;--muted-foreground:#626b78;--viz-series-1:#426190;--viz-series-2:#526278;font:14px/1.5 system-ui,sans-serif;background:var(--background);color:var(--foreground)}
body{margin:0;padding:24px}main{max-width:736px;margin:auto}h2{font-size:20px;line-height:1.3}h3{font-size:16px;line-height:1.4}.text-small{font-size:12px}a{color:inherit}#research-portfolio-loop a.node{text-decoration:none;transition:background .18s,color .18s,border-color .18s}#research-portfolio-loop a.node:hover{background:#1d2533;color:#fff;border-color:#1d2533}a:focus-visible,button:focus-visible{outline:2px solid var(--viz-series-1);outline-offset:3px}.page-nav{display:flex;justify-content:space-between;gap:16px;margin-bottom:20px;color:var(--muted-foreground);font-size:12px}
dialog{box-sizing:border-box;width:min(880px,calc(100% - 24px));max-height:88vh;padding:0;border:1px solid var(--border);border-radius:0;background:var(--background);color:var(--foreground)}dialog::backdrop{background:#1d253360;backdrop-filter:blur(5px)}.reader-bar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;background:var(--background);border-bottom:1px solid var(--border);z-index:1}.reader-bar button{font:inherit;color:inherit;border:1px solid var(--border);background:var(--card);border-radius:0;padding:6px 12px;cursor:pointer}.reader-content{padding:20px 28px;overflow-wrap:anywhere}.reader-content h1{font-size:25px;line-height:1.3}.reader-content h2{margin-top:28px}.reader-content h3{margin-top:24px}.reader-content a{color:var(--viz-series-1);text-underline-offset:3px}.reader-content table{display:block;overflow:auto;border-collapse:collapse;width:100%;font-size:13px}.reader-content th,.reader-content td{text-align:left;padding:10px;min-width:140px;border-bottom:1px solid var(--border);vertical-align:top}.reader-content pre{overflow:auto;padding:12px;background:var(--card);border-radius:0;font-size:12px}.reader-content code{font-family:ui-monospace,monospace}.source-link{font-size:12px}.reader-content img{max-width:100%}[hidden]{display:none!important}@media(max-width:540px){body{padding:12px}.reader-content{padding:14px 16px}}@media(prefers-reduced-motion:reduce){#research-portfolio-loop a.node{transition:none}}

.reader-content{font-size:15px;line-height:1.65}
.reader-content p,.reader-content li{max-width:100%}
.reader-content li+li{margin-top:6px}
.reader-content math{font-family:"STIX Two Math","Cambria Math",math;font-size:1.08em;overflow-wrap:normal}
.reader-content .math-display{margin:22px 0;padding:16px 4px;overflow-x:auto;overflow-y:hidden}
.reader-content .math-display math{display:block;width:max-content;min-width:100%;font-size:1.18em}
.reader-content table{margin:18px 0;line-height:1.5}
.reader-content th{background:var(--card);font-weight:600}
.reader-bar{align-items:flex-start}
.reader-bar button{flex-shrink:0}
@media(max-width:540px){.reader-content{font-size:14px}.reader-content h1{font-size:23px}.reader-bar{padding:12px 16px}.reader-content .math-display{padding:12px 2px}}
/* Paint-only theme: preserve diagram dimensions, text metrics and breakpoints. */
body{background-image:linear-gradient(90deg,transparent calc(100% - 1px),#1d253308 0);background-size:184px 100%;background-position:center top}
.page-nav{color:#626b78}
.page-nav span:first-child{color:#1d2533}
#research-portfolio-loop .number{color:#526278}
#research-portfolio-loop a.node:hover .number{color:#c1c9d3}
#research-portfolio-loop section.wrapper{border-top-color:#1d2533}
.reader-bar button{background:#1d2533;color:#fff;border-color:#1d2533}
.reader-content h1,.reader-content h2,.reader-content h3{color:#1d2533;font-weight:500}
.reader-content a:hover{color:#1d2533}
</style>
</head>
<body>
<main>
<header class="page-nav"><span>Investing Equation</span><span>Simple HTML · Self-contained</span></header>
<!-- DIAGRAM -->
</main>
<dialog id="document-reader" aria-labelledby="reader-title">
<div class="reader-bar"><span id="reader-title">Framework document</span><button type="button" id="close-reader">Close</button></div>
<div class="reader-content">
<!-- DOCUMENTS -->
</div>
</dialog>
<script>
(() => {
  const reader = document.getElementById('document-reader');
  const title = document.getElementById('reader-title');
  const articles = [...reader.querySelectorAll('article')];
  let opener = null;
  function showDocument() {
    const article = articles.find(item => '#' + item.id === location.hash);
    if (!article) { if (reader.open) reader.close(); return; }
    articles.forEach(item => { item.hidden = item !== article; });
    title.textContent = article.querySelector('h1')?.textContent || 'Framework document';
    if (!reader.open) { opener = document.activeElement; reader.showModal(); }
    reader.scrollTop = 0;
  }
  reader.addEventListener('close', () => {
    if (articles.some(item => '#' + item.id === location.hash)) history.replaceState(null, '', location.pathname + location.search);
    opener?.focus();
  });
  document.getElementById('close-reader').addEventListener('click', () => reader.close());
  window.addEventListener('hashchange', showDocument);
  showDocument();
})();
</script>
</body>
</html>
